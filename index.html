<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventario de formaletería · Grupo SIMAP</title>
    <meta
      name="description"
      content="Control de inventario de formaletería de Grupo SIMAP: existencias por tipología, medida, propietario, sede y fecha de compra, con exportación e importación de archivos."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0073c4" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230073C4'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <div class="boot" id="boot" role="status" aria-live="polite">
      <div class="boot__campo" aria-hidden="true">
        <span class="boot__blob boot__blob--1"></span>
        <span class="boot__blob boot__blob--2"></span>
        <span class="boot__blob boot__blob--3"></span>
      </div>
      <div class="boot__panel">
        <div class="boot__name" id="boot-name" aria-label="Grupo SIMAP"></div>
        <div class="boot__track" aria-hidden="true"><span class="boot__fill" id="boot-fill"></span></div>
        <div class="boot__pct" id="boot-pct">Cargando inventario</div>
      </div>
    </div>
    <noscript>
      <div class="shell" style="padding: 40px 0">
        <h1 class="display">Se requiere JavaScript</h1>
        <p class="deck">
          Esta aplicación procesa el inventario en el propio navegador. Active JavaScript para
          consultarlo y editarlo.
        </p>
      </div>
    </noscript>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
